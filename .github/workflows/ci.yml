name: Plugin checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages and SDK examples
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.22.1'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version: '1.26.1'
          cache: false
      - name: Workflow syntax and expressions
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -shellcheck= -pyflakes=
      - name: Script fixtures and syntax
        run: |
          python3 -m unittest discover -s scripts/tests -v
          python3 -m compileall -q scripts
      - name: Concise function and test names
        run: python3 scripts/check-names.py
      - name: Package assets, imports and JavaScript syntax
        run: node --experimental-vm-modules scripts/check-packages.mjs
      - name: Official catalog
        run: python3 scripts/catalog.py --check
      - name: Behavior and localized UI contracts
        run: python3 scripts/test.py
